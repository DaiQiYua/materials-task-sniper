<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>任务狙击台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='8' fill='none' stroke='%234cd97f' stroke-width='2'/%3E%3Ccircle cx='12' cy='12' r='3' fill='%234cd97f'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./static/app.css">
</head>
<body>
<div id="app">

  <!-- ══ 顶栏 ══ -->
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <circle cx="12" cy="12" r="7"></circle>
        <line x1="12" y1="1.5" x2="12" y2="6"></line>
        <line x1="12" y1="18" x2="12" y2="22.5"></line>
        <line x1="1.5" y1="12" x2="6" y2="12"></line>
        <line x1="18" y1="12" x2="22.5" y2="12"></line>
        <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"></circle>
      </svg>
      <div class="brand-text">
        <span class="brand-name">任务狙击台</span>
        <span class="brand-sub">MATERIALS SNIPER</span>
      </div>
    </div>

    <div class="status-cluster">
      <span id="lamp" class="lamp idle"></span>
      <span id="stateText" class="state-text">待命</span>
      <span id="stateReason" class="state-reason hidden"></span>
    </div>

    <div class="topbar-spacer"></div>

    <div class="actions">
      <button id="btnStart" class="btn btn-primary" type="button">启动狙击</button>
      <button id="btnStop" class="btn btn-danger hidden" type="button">停止</button>
    </div>

    <button id="tokenBadge" class="token-badge bad" type="button" title="点击设置 Token">
      <span class="dot"></span><span class="token-label">Token 未配置</span>
    </button>
  </header>

  <!-- ══ SSE 断线提示 ══ -->
  <div id="connBanner" class="conn-banner hidden" role="alert">
    <span class="pulse-dot"></span>连接断开，重连中…
  </div>

  <!-- ══ 遥测条 ══ -->
  <div class="telemetry">
    <div class="stat"><span class="stat-label">上次轮询</span><span id="tLastPoll" class="stat-value">—</span></div>
    <div class="stat-sep"></div>
    <div class="stat"><span class="stat-label">轮询</span><span id="tPolls" class="stat-value">—</span></div>
    <div class="stat-sep"></div>
    <div class="stat ok"><span class="stat-label">成功</span><span id="tOk" class="stat-value">—</span></div>
    <div class="stat-sep"></div>
    <div class="stat conflict"><span class="stat-label">冲突</span><span id="tConflict" class="stat-value">—</span></div>
    <div class="stat-sep"></div>
    <div class="stat fail"><span class="stat-label">失败</span><span id="tFail" class="stat-value">—</span></div>
    <div class="stat-sep"></div>
    <div class="stat"><span class="stat-label">跳过</span><span id="tSkipped" class="stat-value">—</span></div>
    <div class="topbar-spacer"></div>
    <div class="stat"><span class="stat-label">上游</span><span id="tBase" class="stat-value dim">—</span></div>
  </div>

  <!-- ══ 主区 ══ -->
  <main class="layout">

    <!-- 左：实时日志 -->
    <section class="panel logs-panel" aria-label="实时日志">
      <header class="panel-head">
        <h2>实时日志</h2>
        <div class="log-tools">
          <button id="btnPauseScroll" class="btn-tool" type="button">暂停滚动</button>
          <button id="btnClearLogs" class="btn-tool" type="button">清空</button>
        </div>
      </header>
      <div id="logScroll" class="log-scroll">
        <div id="logList" class="log-list"></div>
        <button id="jumpBottom" class="jump-bottom hidden" type="button">↓ 回到最新</button>
      </div>
    </section>

    <!-- 右：配置 / 任务 / 历史 -->
    <section class="right-col">

      <details class="panel config-panel" open>
        <summary>
          <span class="summary-title">配置</span>
          <span id="cfgSavedAt" class="summary-hint"></span>
          <span class="chev" aria-hidden="true"></span>
        </summary>
        <form id="configForm" class="config-form" autocomplete="off">
          <div class="cfg-grid">
            <div class="field span2">
              <label for="cfgBase">上游地址 <code>base</code></label>
              <input id="cfgBase" type="text" placeholder="https://materials.xlya.cn">
            </div>
            <div class="field">
              <label for="cfgPoll">轮询间隔（秒） <code>poll_interval</code></label>
              <input id="cfgPoll" type="number" step="0.1" min="0.2">
            </div>
            <div class="field">
              <label>任务类型 <code>task_types</code></label>
              <div class="check-row">
                <label class="check"><input id="typeStandard" type="checkbox" value="standard"> standard</label>
                <label class="check"><input id="typeLongTerm" type="checkbox" value="long_term"> long_term</label>
              </div>
            </div>
            <div class="field span2">
              <label for="cfgAccount">平台账号 ID（可空） <code>platform_account_id</code></label>
              <input id="cfgAccount" type="text" inputmode="numeric" placeholder="留空则不指定">
            </div>
            <div class="field">
              <label for="cfgRlMax">限速阈值 <code>rate_limit_max</code></label>
              <input id="cfgRlMax" type="number" step="1" min="1">
            </div>
            <div class="field">
              <label for="cfgRlWin">限速窗口（秒） <code>rate_limit_window</code></label>
              <input id="cfgRlWin" type="number" step="0.5" min="0.1">
            </div>
            <div class="field">
              <label for="cfgMaxPages">最大页数 <code>max_pages</code></label>
              <input id="cfgMaxPages" type="number" step="1" min="1">
            </div>
            <div class="field">
              <label for="cfgPageSize">每页条数 <code>page_size</code></label>
              <input id="cfgPageSize" type="number" step="1" min="1">
            </div>
            <div class="field">
              <label for="cfgTimeout">HTTP 超时（秒） <code>http_timeout</code></label>
              <input id="cfgTimeout" type="number" step="1" min="1">
            </div>
            <div class="field">
              <label for="cfgPolls">结果轮询次数 <code>result_polls</code></label>
              <input id="cfgPolls" type="number" step="1" min="0">
            </div>
          </div>
          <div class="form-foot">
            <button id="btnSaveCfg" class="btn btn-primary btn-sm" type="submit">保存配置</button>
          </div>
        </form>
      </details>

      <section class="panel tasks-panel" aria-label="任务列表">
        <header class="panel-head">
          <h2>任务列表</h2>
          <span id="taskMeta" class="panel-meta"></span>
        </header>
        <div class="table-wrap">
          <table id="taskTable" class="data-table hidden">
            <thead>
              <tr>
                <th>标题</th>
                <th class="th-num">佣金</th>
                <th class="th-num">剩余配额</th>
                <th>可领取</th>
                <th>类型</th>
              </tr>
            </thead>
            <tbody id="taskBody"></tbody>
          </table>
          <div id="taskEmpty" class="empty-state">暂无任务 · 等待上游轮询…</div>
        </div>
      </section>

      <section class="panel history-panel" aria-label="领取历史">
        <header class="panel-head">
          <h2>领取历史</h2>
          <span id="historyMeta" class="panel-meta"></span>
        </header>
        <div class="table-wrap">
          <table id="historyTable" class="data-table hidden">
            <thead>
              <tr>
                <th>时间</th>
                <th>任务</th>
                <th class="th-num">佣金</th>
                <th class="th-num">账号</th>
                <th>结果</th>
                <th class="th-num">HTTP</th>
                <th>消息</th>
              </tr>
            </thead>
            <tbody id="historyBody"></tbody>
          </table>
          <div id="historyEmpty" class="empty-state">暂无领取记录</div>
        </div>
      </section>

    </section>
  </main>
</div>

<!-- ══ Toast ══ -->
<div id="toastWrap" class="toast-wrap" aria-live="polite"></div>

<!-- ══ Token 弹层 ══ -->
<div id="tokenModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="tokenTitle">
  <div class="modal-card">
    <header class="modal-head">
      <h3 id="tokenTitle">Token 设置</h3>
      <button id="tokenClose" class="btn-tool" type="button" aria-label="关闭">✕</button>
    </header>
    <p id="tokenHint" class="modal-hint">尚未配置 Token</p>
    <form id="tokenForm">
      <textarea id="tokenInput" class="token-input" spellcheck="false"
        placeholder="粘贴 JWT（eyJ… 开头）"></textarea>
      <p id="tokenErr" class="token-err hidden"></p>
      <footer class="modal-foot">
        <button id="tokenCancel" class="btn btn-ghost" type="button">取消</button>
        <button id="tokenSave" class="btn btn-primary" type="submit">保存并校验</button>
      </footer>
    </form>
  </div>
</div>

<script src="./static/app.js"></script>
</body>
</html>
